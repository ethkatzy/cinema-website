<html lang="en">
<head>
    <title>Manage screens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="icon" type="image/x-icon" href="https://svgsilh.com/svg/2027080.svg">
</head>
<body>
{% include "_banner.html" %}

<div class="login-box">
    <h1 style="color:white">Manage screens</h1>
    <div class="button">
        <a href="/admin">
            Back to admin
        </a>
    </div>
    {% for screenid, screenname in screens %}
    <div class="button">
        <a href="/admin/screens/{{ screenid }}/edit">
            {{ screenname }}
        </a>
    </div>
    {% endfor %}
</div>
</body>
</html>
